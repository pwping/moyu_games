# moyu-games bundle patch: inserts the plugin row into the dsh web profile
# roster. Applied as a profile bundle layer (the `dsh.bundle.patch` manifest
# field); install with `dsh plugin add moyu-games` or
# `dsh plugin --profile web add <path-to-this-folder>`.
- insert:
    - id: moyu-games
      name: 'moyu-games'
